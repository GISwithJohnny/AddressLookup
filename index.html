<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Address Point Lookup</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: #1a1a1a;
      background: #f5f5f2;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .app {
      background: #ffffff;
      border: 1px solid #ddddd8;
      border-radius: 10px;
      padding: 1.75rem;
      width: 100%;
      max-width: 560px;
    }

    .app-title {
      font-size: 17px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 0.35rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .app-title svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .app-subtitle {
      font-size: 12.5px;
      color: #888;
      margin-bottom: 1.5rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid #ebebeb;
    }

    .search-row {
      display: flex;
      gap: 8px;
      margin-bottom: 1.25rem;
    }

    .search-row input {
      flex: 1;
      height: 38px;
      padding: 0 12px;
      border: 1px solid #ddddd8;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      color: #1a1a1a;
      background: #fafaf8;
      outline: none;
      transition: border-color 0.15s;
    }

    .search-row input:focus {
      border-color: #378ADD;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(55, 138, 221, 0.12);
    }

    .search-row input::placeholder { color: #aaa; }

    .btn {
      height: 38px;
      padding: 0 18px;
      background: #1a7fb5;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }

    .btn:hover { background: #155f88; }
    .btn:active { background: #0f4a6b; }

    .result-card {
      border: 1px solid #ddddd8;
      border-radius: 8px;
      padding: 1rem 1.125rem;
      background: #fafaf8;
    }

    .result-card.match    { border-color: #a8d07a; background: #f4faed; }
    .result-card.no-match { border-color: #f0c8c8; background: #fdf3f3; }
    .result-card.error    { border-color: #f0c8c8; background: #fdf3f3; }

    .result-status {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
      background: #ccc;
    }

    .status-dot.loading  { background: #378ADD; animation: pulse 1s ease-in-out infinite; }
    .status-dot.match    { background: #639922; }
    .status-dot.no-match { background: #E24B4A; }
    .status-dot.error    { background: #E24B4A; }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    .status-text { font-size: 14px; font-weight: 600; color: #1a1a1a; }
    .result-card.match    .status-text { color: #3b6d11; }
    .result-card.no-match .status-text { color: #a32d2d; }
    .result-card.error    .status-text { color: #a32d2d; }

    .status-sub {
      font-size: 12.5px;
      color: #666;
      margin-top: 5px;
      display: none;
    }

    .result-card.no-match .status-sub,
    .result-card.error    .status-sub { color: #a32d2d; }

    .fields-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 12px;
      display: none;
    }

    .fields-table tr { border-top: 1px solid #d4eab8; }
    .fields-table tr:first-child { border-top: none; }

    .fields-table td {
      padding: 5px 4px;
      vertical-align: top;
    }

    .fields-table td:first-child {
      color: #5a8a30;
      width: 40%;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      padding-right: 10px;
    }

    .fields-table td:last-child {
      color: #1a1a1a;
      word-break: break-word;
    }

    .more-link {
      font-size: 11.5px;
      color: #888;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>
<div class="app">

  <div class="app-title">
    <svg viewBox="0 0 24 24" fill="none" stroke="#1a7fb5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    Address Point Lookup
  </div>
  <div class="app-subtitle">City of Chattanooga address points</div>

  <div class="search-row">
    <input type="text" id="addressInput" placeholder="e.g. 100 E 11TH ST" />
    <button class="btn" onclick="doSearch()">Search</button>
  </div>

  <div class="result-card" id="resultCard">
    <div class="result-status">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText">Enter an address to begin</span>
    </div>
    <div class="status-sub" id="statusSub"></div>
    <table class="fields-table" id="fieldsTable"></table>
    <div class="more-link" id="moreLink"></div>
  </div>

</div>

<script>
  var LAYER_URL = 'https://pwgis.chattanooga.gov/arcgis/rest/services/Misc/Addressing_FeatService/FeatureServer/0';
  var ADDRESS_FIELD = 'ADDRESS';
  var _cbIndex = 0;

  document.getElementById('addressInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doSearch();
  });

  function setStatus(type, text, sub) {
    document.getElementById('statusDot').className = 'status-dot ' + type;
    document.getElementById('statusText').textContent = text;
    var subEl = document.getElementById('statusSub');
    subEl.style.display = sub ? 'block' : 'none';
    if (sub) subEl.textContent = sub;
    document.getElementById('fieldsTable').style.display = 'none';
    document.getElementById('moreLink').style.display = 'none';
    document.getElementById('resultCard').className = 'result-card' + (type ? ' ' + type : '');
  }

  function showFields(feature) {
    var tbl = document.getElementById('fieldsTable');
    tbl.innerHTML = '';
    var attrs = feature.attributes || {};
    var skip = ['OBJECTID', 'objectid', 'Shape__Area', 'Shape__Length', 'GlobalID', 'globalid'];
    var entries = Object.keys(attrs)
      .filter(function(k) { return skip.indexOf(k) === -1; })
      .map(function(k) { return [k, attrs[k]]; });
    if (!entries.length) return;
    entries.forEach(function(pair) {
      var tr = document.createElement('tr');
      var td1 = document.createElement('td'); td1.textContent = pair[0];
      var td2 = document.createElement('td'); td2.textContent = (pair[1] !== null && pair[1] !== undefined) ? pair[1] : '—';
      tr.appendChild(td1); tr.appendChild(td2);
      tbl.appendChild(tr);
    });
    tbl.style.display = 'table';
  }

  function jsonp(url, params, callback) {
    var cbName = '__agscb' + (++_cbIndex);
    var timeout;

    window[cbName] = function(data) {
      clearTimeout(timeout);
      delete window[cbName];
      document.head.removeChild(script);
      callback(null, data);
    };

    params.callback = cbName;
    params.f = 'json';

    var qs = Object.keys(params).map(function(k) {
      return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
    }).join('&');

    var script = document.createElement('script');
    script.src = url + '?' + qs;
    script.onerror = function() {
      clearTimeout(timeout);
      delete window[cbName];
      document.head.removeChild(script);
      callback(new Error('Script load failed — service may be unreachable.'));
    };

    timeout = setTimeout(function() {
      delete window[cbName];
      if (script.parentNode) document.head.removeChild(script);
      callback(new Error('Request timed out after 10 seconds.'));
    }, 10000);

    document.head.appendChild(script);
  }

  function doSearch() {
    var addr = document.getElementById('addressInput').value.trim();
    if (!addr) return;

    setStatus('loading', 'Searching\u2026');

    var escaped = addr.replace(/'/g, "''");
    var where = 'UPPER(' + ADDRESS_FIELD + ") = UPPER('" + escaped + "')";

    jsonp(LAYER_URL + '/query', {
      where: where,
      outFields: '*',
      returnGeometry: 'false',
      resultRecordCount: '10'
    }, function(err, json) {
      if (err) {
        setStatus('error', 'Request failed', err.message);
        return;
      }
      if (json.error) {
        setStatus('error', 'Query error', json.error.message || 'An error occurred.');
        return;
      }
      var features = json.features || [];
      if (features.length === 0) {
        setStatus('no-match', 'No match found', '"' + addr + '" was not found in the address layer.');
      } else {
        var label = features.length > 1
          ? 'Match found (' + features.length + ' results)'
          : 'Match found';
        setStatus('match', label);
        showFields(features[0]);
        if (features.length > 1) {
          var ml = document.getElementById('moreLink');
          ml.textContent = '+ ' + (features.length - 1) + ' more result' + (features.length > 2 ? 's' : '') + ' \u2014 try a more specific address';
          ml.style.display = 'block';
        }
      }
    });
  }
</script>
</body>
</html>
