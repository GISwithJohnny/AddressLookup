<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Address Point Lookup</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: #1a1a1a;
      background: #f5f5f2;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .app {
      background: #ffffff;
      border: 1px solid #ddddd8;
      border-radius: 10px;
      padding: 1.75rem;
      width: 100%;
      max-width: 560px;
    }

    .app-title {
      font-size: 17px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 0.35rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .app-title svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .app-subtitle {
      font-size: 12.5px;
      color: #888;
      margin-bottom: 1.5rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid #ebebeb;
    }

    .search-row {
      display: flex;
      gap: 8px;
      margin-bottom: 1.25rem;
    }

    .search-row input {
      flex: 1;
      height: 38px;
      padding: 0 12px;
      border: 1px solid #ddddd8;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      color: #1a1a1a;
      background: #fafaf8;
      outline: none;
      transition: border-color 0.15s;
    }

    .search-row input:focus {
      border-color: #378ADD;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(55, 138, 221, 0.12);
    }

    .search-row input::placeholder { color: #aaa; }

    .btn {
      height: 38px;
      padding: 0 18px;
      background: #1a7fb5;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }

    .btn:hover { background: #155f88; }
    .btn:active { background: #0f4a6b; }

    .result-card {
      border: 1px solid #ddddd8;
      border-radius: 8px;
      padding: 1.1rem 1.25rem;
      background: #fafaf8;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      min-height: 56px;
    }

    .result-card.match    { border-color: #a8d07a; background: #f4faed; }
    .result-card.no-match { border-color: #f0c8c8; background: #fdf3f3; }
    .result-card.error    { border-color: #e8dfc0; background: #fdfaf0; }

    .result-icon {
      font-size: 22px;
      line-height: 1;
      flex-shrink: 0;
      margin-top: 1px;
      display: none;
    }

    .result-body { flex: 1; }

    .result-headline {
      font-size: 14px;
      font-weight: 600;
      color: #555;
      line-height: 1.4;
    }

    .result-card.match    .result-headline { color: #2d5a0e; }
    .result-card.no-match .result-headline { color: #8b1f1f; }
    .result-card.error    .result-headline { color: #7a6010; }

    .result-sub {
      font-size: 12.5px;
      color: #888;
      margin-top: 3px;
      display: none;
    }

    .result-card.match    .result-sub { color: #4a8020; }
    .result-card.no-match .result-sub { color: #a85050; }
    .result-card.error    .result-sub { color: #8a7020; }

    .loading-dots {
      display: inline-block;
    }

    .loading-dots::after {
      content: '';
      animation: dots 1.2s steps(4, end) infinite;
    }

    @keyframes dots {
      0%   { content: ''; }
      25%  { content: '.'; }
      50%  { content: '..'; }
      75%  { content: '...'; }
      100% { content: ''; }
    }
  </style>
</head>
<body>
<div class="app">

  <div class="app-title">
    <svg viewBox="0 0 24 24" fill="none" stroke="#1a7fb5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    Address Point Lookup
  </div>
  <div class="app-subtitle">Check if an address is within Chattanooga city limits</div>

  <div class="search-row">
    <input type="text" id="addressInput" placeholder="e.g. 100 E 11TH ST" />
    <button class="btn" onclick="doSearch()">Search</button>
  </div>

  <div class="result-card" id="resultCard">
    <div class="result-icon" id="resultIcon"></div>
    <div class="result-body">
      <div class="result-headline" id="resultHeadline">Enter an address above to check city limits.</div>
      <div class="result-sub" id="resultSub"></div>
    </div>
  </div>

</div>

<script>
  var LAYER_URL = 'https://pwgis.chattanooga.gov/arcgis/rest/services/Misc/Addressing_FeatService/FeatureServer/0';
  var ADDRESS_FIELD = 'ADDRESS';
  var _cbIndex = 0;

  document.getElementById('addressInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doSearch();
  });

  function setResult(type, headline, sub) {
    var card = document.getElementById('resultCard');
    var icon = document.getElementById('resultIcon');
    var hl   = document.getElementById('resultHeadline');
    var sl   = document.getElementById('resultSub');

    card.className = 'result-card' + (type ? ' ' + type : '');

    var icons = { match: '✓', 'no-match': '✕', error: '⚠', loading: '' };
    if (icons[type]) {
      icon.textContent = icons[type];
      icon.style.display = 'block';
    } else {
      icon.style.display = 'none';
    }

    hl.innerHTML = type === 'loading'
      ? 'Searching<span class="loading-dots"></span>'
      : headline;

    if (sub) {
      sl.textContent = sub;
      sl.style.display = 'block';
    } else {
      sl.style.display = 'none';
    }
  }

  function jsonp(url, params, callback) {
    var cbName = '__agscb' + (++_cbIndex);
    var timeout;

    window[cbName] = function(data) {
      clearTimeout(timeout);
      delete window[cbName];
      document.head.removeChild(script);
      callback(null, data);
    };

    params.callback = cbName;
    params.f = 'json';

    var qs = Object.keys(params).map(function(k) {
      return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
    }).join('&');

    var script = document.createElement('script');
    script.src = url + '?' + qs;
    script.onerror = function() {
      clearTimeout(timeout);
      delete window[cbName];
      document.head.removeChild(script);
      callback(new Error('Script load failed.'));
    };

    timeout = setTimeout(function() {
      delete window[cbName];
      if (script.parentNode) document.head.removeChild(script);
      callback(new Error('Request timed out.'));
    }, 10000);

    document.head.appendChild(script);
  }

  function doSearch() {
    var addr = document.getElementById('addressInput').value.trim();
    if (!addr) return;

    setResult('loading');

    var escaped = addr.replace(/'/g, "''");
    var where = 'UPPER(' + ADDRESS_FIELD + ") = UPPER('" + escaped + "')";

    jsonp(LAYER_URL + '/query', {
      where: where,
      outFields: ADDRESS_FIELD,
      returnGeometry: 'false',
      resultRecordCount: '1'
    }, function(err, json) {
      if (err) {
        setResult('error', 'Something went wrong.', err.message);
        return;
      }
      if (json.error) {
        setResult('error', 'Something went wrong.', json.error.message || 'An unexpected error occurred.');
        return;
      }
      var features = json.features || [];
      if (features.length > 0) {
        setResult(
          'match',
          'Yes, this property is within Chattanooga city limits.',
          'A matching address record was found in the city address point layer.'
        );
      } else {
        setResult(
          'no-match',
          'We could not find a matching address within city limits.',
          'Double-check the spelling or try a nearby address. If you believe this is an error, please contact us.'
        );
      }
    });
  }
</script>
</body>
</html>
